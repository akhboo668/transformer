[project]
name = "pytorch-transformer"
version = "0.1.0"
description = "Transformer using PyTorch -- for learning"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.0",
    "numpy",
    "matplotlib",
    "jupyter",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
