[project]
name = "numpy-transformer"
version = "0.1.0"
description = "Transformer from scratch using only NumPy -- for learning"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "matplotlib",
    "jupyter",
]

[project.optional-dependencies]
cloud = [
    "fsspec",
    "s3fs",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
